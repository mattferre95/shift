[package]
name = "shift"
version = "1.1.0"
description = "SHIFT — anything in, anything out."
authors = ["SHIFT"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "shift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
url = "2"
dirs = "6"
rand = "0.8"
libc = "0.2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
